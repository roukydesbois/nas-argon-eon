---
name: Check Ignition config
on:
  pull_request:
    branches:
      - main
    paths:
      - 'ignition/**'
  push:
    branches:
      - main
    paths:
      - 'ignition/**'

jobs:
  butane:
    name: Butane source and Ignition file match
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fails on any Butane warning, and when the committed .ign wasn't regenerated
      - name: Transpile and compare
        run: |
          docker run --rm -i quay.io/coreos/butane:v0.29.0 --strict --pretty \
            < ignition/nas-argon-eon.bu > /tmp/nas-argon-eon.ign
          diff -u ignition/nas-argon-eon.ign /tmp/nas-argon-eon.ign
