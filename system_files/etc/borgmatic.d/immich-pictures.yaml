# One file per backup job (the OMV borg plugin's jobs), all to the same BorgBase repo.
# Repo URL, passphrase and SSH key are host-local (see /etc/nas-argon-eon/README).
repositories:
  - path: ${BORGBASE_REPO}
    label: borgbase
encryption_passcommand: cat /etc/nas-argon-eon/borg-passphrase
ssh_command: ssh -i /etc/nas-argon-eon/borgbase-ssh-key -o StrictHostKeyChecking=accept-new
# Snapshot the btrfs subvolume holding each source first: a consistent copy
# while the apps keep writing
btrfs:
exclude_caches: true
keep_daily: 7
keep_weekly: 4
keep_monthly: 3
compression: auto,zstd,9
archive_name_format: "immich-pictures-{now:%Y-%m-%d_%H-%M-%S}"
match_archives: "sh:immich-pictures-*"
# Thumbnails and transcoded videos are regenerated by Immich
patterns:
  - R /export/thomelab-dynamic-1tb-ssd/immich-immich-library
  - '- fm:/export/thomelab-dynamic-1tb-ssd/immich-immich-library/thumbs'
  - '- fm:/export/thomelab-dynamic-1tb-ssd/immich-immich-library/encoded-video'
# The repository check runs from nextcloud-data.yaml only (same repo for all jobs)
checks:
  - name: disabled
