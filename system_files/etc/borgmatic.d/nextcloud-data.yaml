# One file per backup job (the OMV borg plugin's jobs), all to the same BorgBase repo.
# Repo URL, passphrase and SSH key are host-local (see /etc/nas-argon-eon/README).
repositories:
  - path: ${BORGBASE_REPO}
    label: borgbase
encryption_passcommand: cat /etc/nas-argon-eon/borg-passphrase
ssh_command: ssh -i /etc/nas-argon-eon/borgbase-ssh-key -o StrictHostKeyChecking=accept-new
# A dropped connection mid-transfer (borg exit 87, 2026-11-09) shouldn't cost
# the night's backup: retry after 1, 2 then 3 minutes
retries: 3
retry_wait: 60
# A missing source path is a failure, not a warning: on 2026-11-09 a run that
# couldn't read its sources still created an (empty) archive and reported success
borg_exit_codes:
  - code: 107
    treat_as: error
# Snapshot the btrfs subvolume holding each source first: a consistent copy
# while the apps keep writing
btrfs:
exclude_caches: true
keep_daily: 7
keep_weekly: 4
keep_monthly: 3
compression: auto,zstd,9
archive_name_format: "nextcloud-data-{now:%Y-%m-%d_%H-%M-%S}"
match_archives: "sh:nextcloud-data-*"
# appdata_<instanceid> holds previews and caches, regenerated by Nextcloud
patterns:
  - R /export/thomelab-dynamic-1tb-ssd/nextcloud-nextcloud-data
  - '- sh:/export/thomelab-dynamic-1tb-ssd/nextcloud-nextcloud-data/data/appdata_*'
# Only here, it covers the whole repository. Data is checked less often: it
# reads archives back from BorgBase.
checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: 3 months
