# nas-argon-eon: smartd runs the self-tests and logs to the journal; alerts go
# through nas-smart-check.timer (ntfy). -d sat: the disks sit behind the EON's
# USB-SATA bridge. Short test daily at 03:00, long test on the 1st at 04:00.
DEVICESCAN -d sat -a -o on -S on -n standby,q -s (S/../.././03|L/../01/./04) -W 4,50,55
